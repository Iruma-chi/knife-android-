name: TsukiPort Android ARM64 unsigned build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Test NSP/XCI importer on host
        run: bash scripts/test-nximport-host.sh

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - name: Install Android Rust target
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Knife ARM64 WGPU engine
        working-directory: engine
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
        run: CARGO_NDK_PLATFORM=31 cargo +1.99.0 ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release -p knife --lib

      - name: Fetch and verify launcher logo assets
        run: bash scripts/fetch-official-tsukihime-logo.sh

      - name: Build unsigned TsukiPort APK (CMake builds libnximport.so)
        run: gradle :app:assembleRelease

      - name: Verify APK ZIP alignment and native ELF page alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -v -c -P 16 4 app/build/outputs/apk/release/app-release-unsigned.apk
          python3 scripts/check-elf-page-alignment.py app/build/outputs/apk/release/app-release-unsigned.apk \
            --readelf "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

      - name: Rename unsigned APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/TsukiPort-0.3.0-dev-arm64-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TsukiPort-0.3.0-dev-arm64-unsigned
          path: dist/TsukiPort-0.3.0-dev-arm64-unsigned.apk
