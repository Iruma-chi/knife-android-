name: Android ARM64 debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04


    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0

      - name: Install and verify Android Rust target
        run: |
          rustup target add --toolchain 1.99.0-x86_64-unknown-linux-gnu aarch64-linux-android
          rustup target list --toolchain 1.99.0-x86_64-unknown-linux-gnu --installed
          rustc +1.99.0 --print target-libdir --target aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust Winit GameActivity library
        working-directory: engine
        run: CARGO_NDK_PLATFORM=31 cargo +1.99.0 ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release -p knife --lib

      - name: Prepare permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tsukihime-release.jks"
          chmod 600 "$RUNNER_TEMP/tsukihime-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tsukihime-release.jks" >> "$GITHUB_ENV"

      - name: Fetch official Tsukihime logo asset
        run: bash scripts/fetch-official-tsukihime-logo.sh

      - name: Build debug APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Tsukihime-Android-port-0.1.5.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Tsukihime-Android-0.1.5-arm64-debug
          path: app/build/outputs/apk/debug/Tsukihime-Android-port-0.1.5.apk
